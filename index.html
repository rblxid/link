<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Link | Roblox Indonesia</title>
</head>
<body>

<p>Mengalihkan ke Aplikasi Roblox atau Website Roblox...</p>

<script>
const params = new URLSearchParams(location.search);
const userId = params.get("id");

if (!userId || !/^\d+$/.test(userId)) {
    document.body.innerHTML = "User ID Roblox tidak valid";
} else {

    const appLink =
        "roblox://navigation/profile_card?userId=" +
        userId;

    const webLink =
        "https://www.roblox.com/id/users/" +
        userId + "/profile";

    // Coba buka aplikasi Roblox
    window.location.href = appLink;

    // Jika masih di halaman ini setelah 5 detik,
    // alihkan ke Roblox Website
    setTimeout(() => {
        window.location.replace(webLink);
    }, 5000);
}
</script>

</body>
</html>
