<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roblox Indonesia - Link</title>
</head>
<body>

<p id="status">Memuat profil Roblox...</p>

<script>
const username = new URLSearchParams(location.search)
    .get("users");

const status = document.getElementById("status");

async function openProfile() {
    if (!username) {
        status.textContent = "Username tidak ditemukan di URL";
        return;
    }

    try {
        const response = await fetch(
            "https://users.roblox.com/v1/users/search?keyword=" +
            encodeURIComponent(username) +
            "&limit=10"
        );

        if (!response.ok) {
            throw new Error("HTTP " + response.status);
        }

        const result = await response.json();

        const user = result.data?.find(
            u => u.name.toLowerCase() === username.toLowerCase()
        );

        if (!user) {
            status.textContent = "Username Roblox tidak ditemukan";
            return;
        }

        const userId = user.id;

        status.textContent = "Membuka profil " + user.name;

        const fallback =
            "https://www.roblox.com/id/users/" +
            userId + "/profile";

        const intent =
            "intent://navigation/profile_card?userId=" +
            userId +
            "#Intent;scheme=roblox;" +
            "package=com.roblox.client;" +
            "S.browser_fallback_url=" +
            encodeURIComponent(fallback) +
            ";end";

        location.href = intent;

    } catch (error) {
        status.textContent =
            "Gagal memuat: " + error.message;
    }
}

openProfile();
</script>

</body>
</html>
