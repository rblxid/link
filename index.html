
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roblox Indonesia - Link</title>
</head>
<body>
<script>
const params = new URLSearchParams(window.location.search);
const username = params.get("users");

if (!username) {
    document.body.innerHTML = "Username Roblox tidak ditemukan";
} else {
    openProfile(username);
}

async function openProfile(username) {
    try {
        const response = await fetch(
            "https://users.roblox.com/v1/usernames/users",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    usernames: [username],
                    excludeBannedUsers: false
                })
            }
        );

        const data = await response.json();

        if (!data.data?.length) {
            document.body.innerHTML = "Username tidak ditemukan";
            return;
        }

        const userId = data.data[0].id;

        const fallback =
            `https://www.roblox.com/id/users/${userId}/profile`;

        const intent =
            `intent://navigation/profile_card?userId=${userId}` +
            `#Intent;scheme=roblox;package=com.roblox.client;` +
            `S.browser_fallback_url=${encodeURIComponent(fallback)};end`;

        location.href = intent;

    } catch (error) {
        document.body.innerHTML = "Gagal memuat profil Roblox";
    }
}

openProfile();
</script>
</body>
</html>
